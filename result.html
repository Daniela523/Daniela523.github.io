<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Calculator Result</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="heart-bg"></div>
    <h1>LOVE CALCULATOR</h1>
    <div class="result-box">
      <p>HI <span id="userName"></span>,</p>
      <p>YOUR LOVE SCORE IS</p>
      <div id="emoji"></div>
      <div class="score" id="score"></div>
    </div>
    <div class="share-section">
      <button class="share-btn">WhatsApp</button>
      <button class="share-btn">Facebook</button>
      <button class="share-btn">Instagram</button>
      <button class="copy-btn">Copy Link</button>
    </div>
  </div>
  <script src="result.js"></script>
</body>
</html>
