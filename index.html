<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="heart-bg"></div>
    <h1>LOVE CALCULATOR</h1>
    <form id="loveCalculatorForm">
      <label for="yourName">YOUR NAME</label>
      <input type="text" id="yourName" required>
      <label for="partnerName">PARTNER'S NAME</label>
      <input type="text" id="partnerName" required>
      <p>After you click the "Calculate" button, you will be redirected to a short advertisement for 30 seconds while we process your result.</p>
      <button type="submit">CALCULATE</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
