<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Calculator Results</title>
  <link rel="stylesheet" href="styles.css">
  <script src="html2canvas.min.js"></script> <!-- For converting the result to a PNG -->
</head>
<body>
  <div class="result-container">
    <div class="glass-box">
      <h1>Your Love Score</h1>
      <p id="scoreText"></p>
      <div id="emoji"></div>
    </div>

    <button id="downloadBtn">Download as PNG</button>

    <div class="share-buttons">
      <button id="shareFacebook">Share on Facebook</button>
      <button id="copyLink">Copy Link</button>
    </div>
  </div>

  <script>
    // Generate random love score (0 to 100)
    const loveScore = Math.floor(Math.random() * 101);
    const scoreText = document.getElementById('scoreText');
    const emoji = document.getElementById('emoji');

    // Assign emoji based on the love score
    let emojiHTML = '';
    if (loveScore >= 80) {
      emojiHTML = '❤️😍';
    } else if (loveScore >= 50) {
      emojiHTML = '😊💖';
    } else {
      emojiHTML = '💔😢';
    }

    scoreText.innerText = `Your Love Score is ${loveScore}%`;
    emoji.innerHTML = emojiHTML;

    // HTML2Canvas to download the PNG
    document.getElementById('downloadBtn').addEventListener('click', function() {
      html2canvas(document.querySelector('.glass-box')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'love-score.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    });

    // Facebook sharing
    document.getElementById('shareFacebook').addEventListener('click', function() {
      const facebookShareUrl = `https://www.facebook.com/sharer/sharer.php?u=https://yourdomain.com&quote=My love score is ${loveScore}%! Check yours!`;
      window.open(facebookShareUrl, '_blank');
    });

    // Copy link button
    document.getElementById('copyLink').addEventListener('click', function() {
      const linkText = `My love score is ${loveScore}%! Check yours at https://yourdomain.com`;
      navigator.clipboard.writeText(linkText).then(function() {
        alert('Link copied to clipboard');
      });
    });
  </script>
</body>
</html>
