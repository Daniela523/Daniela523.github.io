<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Score Result</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="result-container">
    <h1> 💖 Your Love Score 💖 </h1>
    <div id="result">
      <p id="scoreText">Your love score is: <span id="loveScore"></span></p>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="downloadBtn">Download Score as Image</button>
    <button id="facebookShareBtn">Share on Facebook</button>
    <button id="copyLinkBtn">Copy Link</button>
  </div>

  <script src="final.js"></script>
</body>
</html>
